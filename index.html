<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momo's Business</title>
<style>
:root {
  --navy: #14263d;
  --navy2: #1c3551;
  --green: #16845b;
  --bg: #f4f7fb;
  --white: #ffffff;
  --text: #172536;
  --muted: #687789;
  --border: #e2e8f0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
}
button, input, select { font: inherit; }
button { cursor: pointer; }
.layout {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: 250px;
  background: var(--navy);
  color: white;
  padding: 24px 14px;
  flex-shrink: 0;
}
.brand {
  font-size: 19px;
  font-weight: bold;
  padding: 0 10px 28px;
}
.brand span { color: #4bd49b; }
.nav-label {
  color: #91a7bf;
  font-size: 10px;
  letter-spacing: 1.3px;
  margin: 20px 10px 8px;
}
.nav {
  width: 100%;
  border: 0;
  color: #d3deea;
  background: transparent;
  padding: 12px;
  border-radius: 8px;
  text-align: left;
  margin: 2px 0;
}
.nav:hover { background: #ffffff12; }
.nav.active {
  background: #214b4a;
  color: white;
  border-left: 3px solid #4bd49b;
}
main { flex: 1; min-width: 0; }
.topbar {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.topbar small { color: var(--muted); }
.content { padding: 28px; max-width: 1500px; margin: auto; }
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 24px;
}
h1 { font-size: 27px; margin: 0 0 8px; }
h2 { font-size: 16px; margin: 0 0 16px; }
p { line-height: 1.5; }
.muted { color: var(--muted); font-size: 13px; }
.eyebrow {
  color: var(--green);
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}
.button {
  padding: 10px 14px;
  border: 1px solid var(--border);
  background: white;
  color: var(--text);
  border-radius: 8px;
}
.button.primary {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.button:hover { opacity: .88; }
.grid {
  display: grid;
  gap: 16px;
}
.metrics {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 18px;
}
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  min-width: 0;
}
.metric-label { color: var(--muted); font-size: 12px; }
.metric-value {
  font-size: 25px;
  font-weight: bold;
  margin: 14px 0 8px;
}
.metric-note { color: var(--muted); font-size: 11px; }
.two-columns {
  grid-template-columns: 1.5fr 1fr;
}
.quick-link {
  display: block;
  text-align: left;
  width: 100%;
  background: white;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 14px;
  margin: 8px 0;
}
.quick-link:hover { border-color: var(--green); }
.quick-link strong { display: block; }
.quick-link small { color: var(--muted); display: block; margin-top: 5px; }
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  text-align: left;
  padding: 13px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
th {
  background: #f8fafc;
  color: var(--muted);
  text-transform: uppercase;
  font-size: 10px;
}
.table-wrap { overflow-x: auto; }
.empty {
  text-align: center;
  color: var(--muted);
  padding: 28px 12px;
  font-size: 13px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: bold; }
.field input, .field select {
  padding: 11px;
  border: 1px solid #d3dce7;
  border-radius: 7px;
  width: 100%;
  background: white;
}
.full { grid-column: 1 / -1; }
.form-actions { margin-top: 16px; }
.notice {
  background: #eaf5ef;
  color: #285d46;
  padding: 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 18px;
}
.badge {
  display: inline-block;
  padding: 5px 8px;
  border-radius: 20px;
  background: #eaf5ef;
  color: #18794e;
  font-size: 10px;
}
.badge.pending { background: #fff3d6; color: #956000; }
.hidden { display: none !important; }
.bar-chart {
  display: flex;
  align-items: end;
  gap: 12px;
  height: 190px;
  padding: 15px 5px 24px;
  border-bottom: 1px solid var(--border);
}
.bar-column {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: end;
  position: relative;
}
.bar {
  width: 100%;
  background: var(--green);
  border-radius: 5px 5px 0 0;
  min-height: 3px;
}
.bar-label {
  position: absolute;
  bottom: -22px;
  width: 100%;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
}
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--navy);
  color: white;
  padding: 14px 18px;
  border-radius: 9px;
  z-index: 10;
}
@media(max-width:1000px) {
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two-columns { grid-template-columns: 1fr; }
}
@media(max-width:700px) {
  .layout { display: block; }
  .sidebar { width: 100%; padding: 14px; }
  .brand { padding-bottom: 12px; }
  .nav-label { margin-top: 12px; }
  .nav { width: auto; display: inline-block; }
  .content { padding: 16px; }
  .topbar { padding: 14px 16px; }
  .page-head { display: block; }
  .page-head .button { margin-top: 12px; }
  .metrics { gap: 10px; }
  .card { padding: 14px; }
  .metric-value { font-size: 20px; }
  .form-grid { grid-template-columns: 1fr; }
  .full { grid-column: auto; }
}
</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
  <div class="brand">Momo's <span>Business</span></div>

  <div class="nav-label">ESPACE DE TRAVAIL</div>
  <button class="nav active" data-page="dashboard">⌂ Accueil</button>
  <button class="nav" data-page="companies">▦ Entreprises</button>

  <div class="nav-label">GESTION</div>
  <button class="nav" data-page="products">▤ Produits et stocks</button>
  <button class="nav" data-page="sales">↗ Ventes et clients</button>
  <button class="nav" data-page="purchases">↙ Achats et fournisseurs</button>
  <button class="nav" data-page="finance">◈ Trésorerie et finances</button>
  <button class="nav" data-page="reports">▥ Analyses et rapports</button>

  <div class="nav-label">FORMATION</div>
  <button class="nav" data-page="academy">Académie</button>

  <div class="nav-label">CONFIGURATION</div>
  <button class="nav" data-page="settings">⚙ Paramètres</button>
</aside>

<main>
  <header class="topbar">
    <strong id="breadcrumb">Espace de travail / Accueil</strong>
    <small>Prototype de gestion</small>
  </header>
  <div class="content" id="content"></div>
</main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function () {
"use strict";

var titles = {
  dashboard: "Accueil",
  companies: "Entreprises",
  products: "Produits et stocks",
  sales: "Ventes et clients",
  purchases: "Achats et fournisseurs",
  finance: "Trésorerie et finances",
  reports: "Analyses et rapports",
  academy: "Académie",
  settings: "Paramètres"
};

var defaultState = {
  currency: "MAD",
  companies: [],
  products: [],
  sales: [],
  purchases: [],
  expenses: [],
  activeCompany: "",
  rates: {
    MAD: 1, EUR: 10.8, USD: 9.9, GBP: 12.5,
    CAD: 7.2, CHF: 11.2, DZD: 0.074, TND: 3.2
  }
};

var state = loadState();
var currentPage = "dashboard";

function loadState() {
  try {
    var saved = localStorage.getItem("momosBusiness");
    return saved ? Object.assign({}, defaultState, JSON.parse(saved))
                 : JSON.parse(JSON.stringify(defaultState));
  } catch (error) {
    return JSON.parse(JSON.stringify(defaultState));
  }
}

function saveState() {
  try {
    localStorage.setItem("momosBusiness", JSON.stringify(state));
  } catch (error) {
    notify("La sauvegarde locale a échoué.");
  }
}

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).substring(2, 7);
}

function escapeHTML(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
    return {
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    }[c];
  });
}

function number(value) {
  var n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function money(value, currency) {
  var code = currency || state.currency;
  try {
    return new Intl.NumberFormat("fr-FR", {
      style: "currency",
      currency: code,
      maximumFractionDigits: 2
    }).format(number(value));
  } catch (error) {
    return number(value).toFixed(2) + " " + code;
  }
}

function notify(message) {
  var el = document.getElementById("toast");
  el.textContent = message;
  el.classList.remove("hidden");
  window.setTimeout(function () {
    el.classList.add("hidden");
  }, 3000);
}

function activeCompany() {
  for (var i = 0; i < state.companies.length; i++) {
    if (state.companies[i].id === state.activeCompany) {
      return state.companies[i];
    }
  }
  return null;
}

function companyRows(key) {
  var company = activeCompany();
  if (!company) return [];
  return state[key].filter(function (item) {
    return item.companyId === company.id;
  });
}

function convert(amount, currency) {
  var target = currency || state.currency;
  var baseRate = number(state.rates[state.currency]) || 1;
  var sourceRate = number(state.rates[target]) || 1;
  return number(amount) * sourceRate / baseRate;
}

function totalRevenue() {
  return companyRows("sales").reduce(function (sum, sale) {
    return sum + convert(sale.total, sale.currency);
  }, 0);
}

function paidRevenue() {
  return companyRows("sales").reduce(function (sum, sale) {
    return sum + (sale.paid ? convert(sale.total, sale.currency) : 0);
  }, 0);
}

function totalExpenses() {
  return companyRows("expenses").reduce(function (sum, expense) {
    return sum + convert(expense.amount, expense.currency);
  }, 0);
}

function totalPurchasesPaid() {
  return companyRows("purchases").reduce(function (sum, purchase) {
    return sum + (purchase.paid ? convert(purchase.total, purchase.currency) : 0);
  }, 0);
}

function estimatedCash() {
  return paidRevenue() - totalPurchasesPaid() - totalExpenses();
}

function costOfSales() {
  var products = {};
  companyRows("products").forEach(function (product) {
    products[product.id] = product;
  });
  return companyRows("sales").reduce(function (sum, sale) {
    var product = products[sale.productId];
    if (!product) return sum;
    return sum + convert(number(product.cost) * number(sale.qty), product.currency);
  }, 0);
}

function pageHead(title, description, button) {
  return '<div class="page-head"><div>' +
    '<div class="eyebrow">MOMO\'S BUSINESS</div>' +
    '<h1>' + title + '</h1><p class="muted">' + description + '</p>' +
    '</div>' + (button || "") + '</div>';
}

function metric(label, value, note) {
  return '<div class="card"><div class="metric-label">' + label +
    '</div><div class="metric-value">' + value +
    '</div><div class="metric-note">' + note + '</div></div>';
}

function empty(message) {
  return '<div class="empty">' + message + '</div>';
}

function table(headers, rows) {
  if (!rows.length) return empty("Aucune donnée enregistrée pour le moment.");
  var html = '<div class="table-wrap"><table><thead><tr>';
  headers.forEach(function (header) {
    html += '<th>' + header + '</th>';
  });
  html += '</tr></thead><tbody>';
  rows.forEach(function (row) {
    html += '<tr>';
    row.forEach(function (cell) {
      html += '<td>' + cell + '</td>';
    });
    html += '</tr>';
  });
  return html + '</tbody></table></div>';
}

function currencyOptions(selected) {
  var currencies = ["MAD", "EUR", "USD", "GBP", "CAD", "CHF",
                    "DZD", "TND", "AED", "SAR", "JPY", "CNY"];
  var html = "";
  currencies.forEach(function (currency) {
    html += '<option value="' + currency + '"' +
      (currency === selected ? " selected" : "") + '>' +
      currency + '</option>';
  });
  return html;
}

function companyNotice() {
  if (activeCompany()) return "";
  return '<div class="notice">Créez ou sélectionnez une entreprise dans la page Entreprises pour commencer.</div>';
}

function dashboardPage() {
  var company = activeCompany();
  var revenue = totalRevenue();
  var margin = revenue - costOfSales();
  var unpaid = revenue - paidRevenue();
  var sales = companyRows("sales").slice().reverse().slice(0, 5);

  var bars = [0, 0, 0, 0, 0, 0, 0];
  companyRows("sales").forEach(function (sale) {
    var day = new Date(sale.date).getDay();
    bars[day] += convert(sale.total, sale.currency);
  });

  var max = Math.max.apply(null, bars.concat([1]));
  var labels = ["D", "L", "M", "M", "J", "V", "S"];
  var chart = '<div class="bar-chart">';
  bars.forEach(function (value, index) {
    var height = Math.max(3, value / max * 100);
    chart += '<div class="bar-column"><div class="bar" style="height:' +
      height + '%"></div><div class="bar-label">' +
      labels[index] + '</div></div>';
  });
  chart += '</div>';

  var html = pageHead(
    "Accueil",
    "Vue d’ensemble de votre activité et de vos indicateurs clés.",
    '<button class="button primary" onclick="go(\'sales\')">+ Nouvelle vente</button>'
  );

  html += companyNotice();
  html += '<div class="grid metrics">' +
    metric("Chiffre d’affaires", company ? money(revenue) : "—",
           "Ventes enregistrées") +
    metric("Trésorerie estimée", company ? money(estimatedCash()) : "—",
           "Selon les opérations saisies") +
    metric("Marge brute estimée", company ? money(margin) : "—",
           "Ventes moins coût des produits vendus") +
    metric("Montants clients à recevoir", company ? money(unpaid) : "—",
           "Ventes non encore payées") + '</div>';

  html += '<div class="grid two-columns"><div class="card">' +
    '<h2>Activité des ventes</h2>' +
    (company ? chart : empty("Les graphiques apparaîtront après vos premières ventes.")) +
    '</div><div class="card"><h2>Accès rapide</h2>' +
    '<button class="quick-link" onclick="go(\'sales\')"><strong>Nouvelle vente</strong><small>Enregistrer un produit vendu ou une prestation</small></button>' +
    '<button class="quick-link" onclick="go(\'products\')"><strong>Ajouter un article</strong><small>Compléter le catalogue</small></button>' +
    '<button class="quick-link" onclick="go(\'finance\')"><strong>Ajouter une dépense</strong><small>Mettre à jour les charges</small></button>' +
    '</div></div>';

  html += '<div class="card"><h2>Ventes récentes</h2>';
  html += table(["Date", "Désignation", "Quantité", "Montant", "Paiement"],
    sales.map(function (sale) {
      return [
        escapeHTML(sale.date),
        escapeHTML(sale.name),
        escapeHTML(sale.qty),
        money(sale.total, sale.currency),
        sale.paid ? '<span class="badge">Payée</span>' :
          '<span class="badge pending">À régler</span>'
      ];
    }));
  html += '</div><p class="muted">Les indicateurs sont des estimations de gestion. Ils ne remplacent pas une comptabilité certifiée.</p>';
  return html;
}

function companiesPage() {
  var html = pageHead("Entreprises",
    "Créez et sélectionnez les entreprises que vous souhaitez gérer.",
    '<button class="button primary" onclick="showForm(\'companyForm\')">+ Ajouter une entreprise</button>');

  html += '<div class="card hidden" id="companyForm"><h2>Nouvelle entreprise</h2>' +
    '<form onsubmit="addCompany(event)"><div class="form-grid">' +
    '<div class="field"><label>Nom de l’entreprise *</label><input name="name" required></div>' +
    '<div class="field"><label>Activité</label><select name="type">' +
    '<option>Commerce et services</option><option>Commerce de produits</option>' +
    '<option>Prestations de services</option></select></div>' +
    '<div class="field"><label>Devise principale</label><select name="currency">' +
    currencyOptions(state.currency) + '</select></div>' +
    '<div class="field"><label>Pays d’origine / Siège</label><input name="originCountry" placeholder="ex: Maroc"></div>' +
    '<div class="field full"><label>Pays & zones d’activité (séparés par des virgules)</label><input name="targetCountries" placeholder="ex: Maroc, France, Espagne, Afrique de l’Ouest"></div>' +
    '</div><div class="form-actions"><button class="button primary">Créer l’entreprise</button> ' +
    '<button type="button" class="button" onclick="hideForm(\'companyForm\')">Annuler</button></div></form></div>';

  if (!state.companies.length) {
    html += '<div class="card">' + empty("Aucune entreprise. Ajoutez votre première entreprise pour commencer.") + '</div>';
  } else {
    state.companies.forEach(function (company) {
      var selected = company.id === state.activeCompany;
      var origin = company.originCountry || company.country || "Non spécifié";
      var targets = company.targetCountries || "Zone locale";

      html += '<div class="card"><h2>' + escapeHTML(company.name) + '</h2>' +
        '<p class="muted">' + escapeHTML(company.type) + ' · Devise: ' + escapeHTML(company.currency) + '</p>' +
        '<p style="font-size: 13px; margin: 8px 0;"><strong>Siège / Origine :</strong> ' + escapeHTML(origin) + '</p>' +
        '<p style="font-size: 13px; margin: 8px 0 14px;"><strong>Zones d’activité :</strong> ' + escapeHTML(targets) + '</p>' +
        (selected ? '<span class="badge">Entreprise active</span>' :
          '<button class="button primary" onclick="selectCompany(\'' +
          company.id + '\')">Sélectionner</button> ') +
        ' <button class="button" onclick="deleteCompany(\'' +
        company.id + '\')">Supprimer</button></div>';
    });
  }
  return html;
}

function productsPage() {
  var products = companyRows("products");
  var html = pageHead("Produits et stocks",
    "Gérez vos produits, prestations, prix et quantités.",
    '<button class="button primary" onclick="showForm(\'productForm\')">+ Ajouter un article</button>');

  html += companyNotice();
  html += '<div class="card hidden" id="productForm"><h2>Nouvel article</h2>' +
    '<form onsubmit="addProduct(event)"><div class="form-grid">' +
    '<div class="field"><label>Nom *</label><input name="name" required></div>' +
    '<div class="field"><label>Type</label><select name="type"><option>Produit</option><option>Service</option></select></div>' +
    '<div class="field"><label>Coût unitaire</label><input name="cost" type="number" min="0" step="0.01" value="0"></div>' +
    '<div class="field"><label>Prix de vente</label><input name="price" type="number" min="0" step="0.01" value="0"></div>' +
    '<div class="field"><label>Stock initial</label><input name="stock" type="number" min="0" step="1" value="0"></div>' +
    '<div class="field"><label>Devise</label><select name="currency">' + currencyOptions(state.currency) + '</select></div>' +
    '</div><div class="form-actions"><button class="button primary">Enregistrer</button></div></form></div>';

  html += '<div class="card">' + table(
    ["Article", "Type", "Coût", "Prix de vente", "Stock", "Marge unitaire"],
    products.map(function (product) {
      return [
        escapeHTML(product.name), escapeHTML(product.type),
        money(product.cost, product.currency), money(product.price, product.currency),
        product.type === "Service" ? "—" : escapeHTML(product.stock),
        money(number(product.price) - number(product.cost), product.currency)
      ];
    })
  ) + '</div>';
  return html;
}

function salesPage() {
  var products = companyRows("products");
  var sales = companyRows("sales").slice().reverse();
  var html = pageHead("Ventes et clients",
    "Enregistrez les ventes de produits et les prestations facturées.",
    '<button class="button primary" onclick="showForm(\'saleForm\')">+ Nouvelle vente</button>');

  html += companyNotice();
  html += '<div class="card hidden" id="saleForm"><h2>Enregistrer une vente</h2>';

  if (!products.length) {
    html += empty("Ajoutez d’abord un produit ou une prestation dans Produits et stocks.");
  } else {
    html += '<form onsubmit="addSale(event)"><div class="form-grid">' +
      '<div class="field full"><label>Article *</label><select name="productId" required><option value="">Choisir</option>' +
      products.map(function (product) {
        return '<option value="' + product.id + '">' + escapeHTML(product.name) +
          ' — ' + money(product.price, product.currency) + '</option>';
      }).join("") + '</select></div>' +
      '<div class="field"><label>Quantité</label><input name="qty" type="number" min="1" value="1" required></div>' +
      '<div class="field"><label>Devise de vente</label><select name="currency">' +
      currencyOptions(state.currency) + '</select></div>' +
      '<div class="field"><label>Date</label><input name="date" type="date" value="' +
      new Date().toISOString().slice(0, 10) + '" required></div>' +
      '<div class="field"><label>Paiement</label><select name="paid"><option value="true">Payée</option><option value="false">À régler</option></select></div>' +
      '</div><div class="form-actions"><button class="button primary">Enregistrer la vente</button></div></form>';
  }
  html += '</div><div class="card">' + table(
    ["Date", "Désignation", "Quantité", "Montant", "Paiement"],
    sales.map(function (sale) {
      return [
        escapeHTML(sale.date), escapeHTML(sale.name), escapeHTML(sale.qty),
        money(sale.total, sale.currency),
        sale.paid ? '<span class="badge">Payée</span>' :
          '<span class="badge pending">À régler</span>'
      ];
    })
  ) + '</div>';
  return html;
}

function purchasesPage() {
  var purchases = companyRows("purchases").slice().reverse();
  var html = pageHead("Achats et fournisseurs",
    "Suivez les achats et les sommes dues aux fournisseurs.",
    '<button class="button primary" onclick="showForm(\'purchaseForm\')">+ Nouvel achat</button>');

  html += companyNotice();
